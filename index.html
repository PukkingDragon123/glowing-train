<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIX CHAMBERS — bet, pull, breathe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>

    <div id="hud">
      <div class="hud-cell">
        <span class="hud-label">Chips</span>
        <span class="hud-value" id="hud-chips">$0</span>
      </div>
      <div class="hud-cell hud-goal">
        <span class="hud-label">Walk out at <b id="hud-goal">$5,000</b></span>
        <div class="bar"><i id="hud-bar"></i></div>
      </div>
      <div class="hud-cell hud-right">
        <span class="hud-label">Pot</span>
        <span class="hud-value pot" id="hud-pot">—</span>
      </div>
    </div>

    <div id="panel"></div>

    <div id="overlay" class="hidden"></div>

    <button id="mute" title="Mute (M)" aria-label="Mute">♪</button>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
